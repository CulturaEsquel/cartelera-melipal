<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartelera Digital - Centro Cultural Melipal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="cartelera-grid">
  <!-- Zona 1: Resumen de Próximos Eventos (Columna Izquierda) -->
<aside class="zona-resumen">
    <h2 class="resumen-titulo">Próximos Eventos</h2>
    <div class="resumen-scroll-container" id="resumen">
      <div id="resumen-contenido"></div>
    </div>
  </aside>

  <!-- Zona 2: Eventos Principales (Columna Central) -->
  <main class="zona-carrusel" id="eventos"></main>

  <!-- Zona 3: Talleres (Derecha Superior) -->
  <section class="zona-talleres-wrapper">
    <div class="etiqueta-vertical">Talleres</div>
    <div class="zona carrusel-secundario" id="talleres"></div>
    <div class="zona-qr">
      <img src="img/QR_T.jpg" alt="QR Talleres">
    </div>
  </section>

  <!-- Zona 4: Muestras (Derecha Inferior) -->
  <section class="zona-muestras-wrapper">
    <div class="etiqueta-vertical">Muestras</div>
    <div class="zona carrusel-secundario" id="muestras"></div>
    <div class="zona-qr">
    </div>
  </section>
</div>

<script src="js/galerias.js"></script>
<script src="js/resumen.js"></script>
<script src="js/resumen-scroll.js"></script>
</body>
</html>
